<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff6b9d">
  <title>Registro de Turnos · Sin conexión</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #3b2f4a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #fff0f6 0%, #f5f3ff 55%, #ecfdf5 100%);
    }
    main {
      width: min(100%, 430px);
      padding: 32px 24px;
      border: 1px solid #f1e4f3;
      border-radius: 24px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 18px 45px rgba(167, 139, 250, .2);
    }
    img { width: 112px; height: 112px; }
    h1 { margin: 12px 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 22px; color: #7c6f8a; line-height: 1.5; }
    a {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 999px;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      background: linear-gradient(90deg, #ff6b9d, #a78bfa);
      box-shadow: 0 8px 20px rgba(255, 107, 157, .3);
    }
  </style>
</head>
<body>
  <main>
    <img src="./logo.svg" alt="Registro de Turnos" width="112" height="112">
    <h1>Estás sin conexión</h1>
    <p>La aplicación se guardará automáticamente. Vuelve a intentarlo cuando recuperes internet para sincronizar tus turnos con Firebase.</p>
    <a href="./">Intentar novamente</a>
  </main>
</body>
</html>
